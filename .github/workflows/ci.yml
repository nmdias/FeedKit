name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

# The macOS toolchain pair is pinned here once. `runs-on` cannot read env
# vars, so the `xcode-27` runner label still appears on every macOS job.
# To roll back: set the label back to `macos-26` and XCODE_APP to
# /Applications/Xcode_26.6.app.
env:
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  linux-build-and-test:
    name: Test (swift linux)
    runs-on: ubuntu-latest
    container:
      # Swift 6.4.1 matches the compiler shipped with Xcode 27.
      # (Was 6.0-focal; that image stopped being updated in April 2025.)
      image: swift:6.4.1
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Build and Test
        run: swift test

  wasi-build:
    name: Build (swift WASI)
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.1
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Install Swift SDK for WebAssembly
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.1-release/wasm-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8

      - name: Build
        run: swift build --build-tests --swift-sdk swift-6.4.1-RELEASE_wasm

  macos-build-and-test:
    name: Test (swift macOS)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: List available devices
        run: xcrun simctl list devices available

      - name: Show Swift Version
        run: swift --version

      - name: Build and Test
        run: set -o pipefail && swift test | xcbeautify

  example-build:
    name: Build (example app)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Build (macOS)
        run: |
          set -o pipefail
          xcodebuild \
            -project Example/Example.xcodeproj \
            -scheme Example \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project Example/Example.xcodeproj \
            -scheme Example \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

  macos-build-and-test-xcodebuild-macos:
    name: Test (xcodebuild macOS)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: List available devices
        run: xcrun simctl list devices available

      - name: Build and Test
        run: set -o pipefail && xcodebuild -scheme FeedKit-Package -destination 'platform=macOS,arch=arm64' test | xcbeautify

  macos-build-and-test-xcodebuild-ios:
    name: Test (xcodebuild iOS)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: List available devices
        run: xcrun simctl list devices available

      - name: Build and Test
        run: set -o pipefail && xcodebuild -scheme FeedKit-Package -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' test | xcbeautify

  macos-build-and-test-xcodebuild-tvos:
    name: Test (xcodebuild tvOS)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: List available devices
        run: xcrun simctl list devices available

      - name: Build and Test
        run: set -o pipefail && xcodebuild -scheme FeedKit-Package -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0' test | xcbeautify

  macos-build-and-test-xcodebuild-watchos:
    name: Test (xcodebuild watchOS)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: List available devices
        run: xcrun simctl list devices available

      - name: Build and Test
        run: set -o pipefail && xcodebuild -scheme FeedKit-Package -destination 'platform=watchOS Simulator,name=Apple Watch Series 12 (42mm),OS=27.0' test | xcbeautify

  macos-build-and-test-xcodebuild-visionos:
    name: Test (xcodebuild visionOS)
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: List available devices
        run: xcrun simctl list devices available

      - name: Build and Test
        run: set -o pipefail && xcodebuild -scheme FeedKit-Package -destination 'platform=visionOS Simulator,name=Apple Vision Pro,OS=27.0' test | xcbeautify
