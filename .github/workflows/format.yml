name: Format

on:
  push:
    branches:
      - main
jobs:
  swift_format:
    name: swift format
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run format.sh
        run: |
          chmod +x ./format.sh
          ./format.sh      

      - name: Commit format
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Run format.sh
          branch: 'main'
