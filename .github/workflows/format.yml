name: Format

on:
  push:
    branches:
      - main
jobs:
  swift_format:
    name: swift format
    # SwiftFormat comes preinstalled on the runner image (0.63.1 on macos-26),
    # so this job needs no Xcode toolchain — an earlier `xcode-select` step was
    # a no-op. The runner label is what pins the SwiftFormat version that runs.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run format.sh
        run: |
          chmod +x ./format.sh
          ./format.sh      

      - name: Commit format
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Run format.sh
          branch: 'main'
